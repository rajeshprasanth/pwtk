# ============================================================
# QE Band Structure + DOS Plot Configuration File
# ============================================================
# This file defines all input/output paths and plotting parameters
# used by the plotting script.
# Edit this file per system (no need to modify the main script).
# ============================================================


# ============================================================
# ===== SYSTEM & FILE PATHS =====
# ============================================================

# Name of first layer (used for labeling and path construction)
LAYER_1="BN"

# Name of second layer
LAYER_2="MoS2"

# Base directory containing QE outputs
# Must contain bands.dat.gnu, dos.dat, bands.out, nscf output, etc.
DATAFILE_PATH="/home/rajeshprashanth/gcp_output_02042026/es_soc_ncpp/${LAYER_1}_${LAYER_2}.soc"

# -------- QE Generated Data Files --------

# Band structure data (output of bands.x)
# Typically ends with .bands.dat.gnu
BANDS_DATA_FILE="${DATAFILE_PATH}/${LAYER_1}_${LAYER_2}.soc.bands.dat.gnu"

# Density of states data (output of dos.x)
DOS_DATA_FILE="${DATAFILE_PATH}/${LAYER_1}_${LAYER_2}.soc.dos.dat"

# bands.x output file (used to extract high-symmetry points)
BANDS_OUT="${DATAFILE_PATH}/${LAYER_1}_${LAYER_2}.soc.bands.out"

# NSCF DOS output file (used to extract Fermi energy if needed)
SCF_OUT="${DATAFILE_PATH}/${LAYER_1}_${LAYER_2}.soc.nscf.dos.out"


# ============================================================
# ===== OUTPUT SETTINGS =====
# ============================================================

# Prefix used for generated plot filenames
# Output files will be:
#   PREFIX_bands.pdf
#   PREFIX_dos.pdf
#   PREFIX_bands_dos.pdf
PREFIX=${LAYER_1}_${LAYER_2}

# Output format:
#   png  → raster image (good for PPT/thesis)
#   pdf  → vector format (recommended for journal)
#   jpeg → compressed image (not recommended for publication)
FORMAT="pdf"   # change to: png / pdf / jpeg


# ============================================================
# ===== TITLES =====
# ============================================================

# Common title used for combined plot
TITLE="${LAYER_1}/${LAYER_2} Bandstructure and DOS"

# Title for band-only plot
BANDS_TITLE="${LAYER_1}/${LAYER_2} Bandstructure"

# Title for DOS-only plot
DOS_TITLE="${LAYER_1}/${LAYER_2} DOS"


# ============================================================
# ===== ENERGY WINDOW (Y-axis range in eV) =====
# ============================================================
# Energy range is plotted relative to Fermi level (E - Ef)

EMIN=-4      # Lower bound (eV)
EMAX=4       # Upper bound (eV)


# ============================================================
# ===== DOS RANGE (X-axis range) =====
# ============================================================
# Controls horizontal extent of DOS panel

DOSMIN=0
DOSMAX=40


# ============================================================
# ===== HIGH-SYMMETRY LABELS =====
# ============================================================
# Labels corresponding to k-path high-symmetry points.
# Must match the number of high-symmetry x-coordinates
# extracted from bands.out.
# Use enhanced mode syntax for subscripts if needed:
#   MoS_{2}
#   Γ

KLABELS=("Γ" "K" "M" "Γ")
